<!DOCTYPE html>
<html lang="{{ lang }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="{{ description }}">
        <meta name="keywords" content="{{ keywords }}">
        <meta name="author" content="{{ author }}">
        {%- if canonical %}
        <link rel="canonical" href="{{ canonical }}">
        {%- endif %}

        <!-- Open Graph / Facebook / Discord -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="{{ title }}">
        <meta property="og:description" content="{{ description }}">
        {%- if canonical %}
        <meta property="og:url" content="{{ canonical }}">
        {%- endif %}
        <meta property="og:image" content="{{ og_image }}">

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{{ title }}">
        <meta name="twitter:description" content="{{ description }}">
        <meta name="twitter:image" content="{{ og_image }}">

        <title>{{ title }}</title>

        <!-- Hide until the theme is applied, then reveal. The noscript block
             below is what keeps the page visible when JS is unavailable. -->
        <style>html{visibility: hidden;opacity:0;}</style>
        <link rel="stylesheet" href="{{ prefix }}pygments.css" type="text/css">
        <link rel="stylesheet" href="{{ theme }}" type="text/css" media="print" onload="this.media='all'">
        <link rel="icon" type="image/x-icon" href="{{ prefix }}favicon.ico">
        <script>
            (function () {
                function reveal() {
                    var el = document.documentElement;
                    if (!el || el.style.visibility === 'visible') return;
                    el.style.visibility = 'visible';
                    el.style.opacity = 1;
                }
                window.addEventListener('load', reveal);
                // A hanging theme CDN must never leave the page blank forever.
                window.setTimeout(reveal, 3000);
            })();
        </script>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@{{ katex_version }}/dist/katex.min.css">
        <script defer src="https://cdn.jsdelivr.net/npm/katex@{{ katex_version }}/dist/katex.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/katex@{{ katex_version }}/dist/contrib/auto-render.min.js"></script>
        <!-- markdown-katex has insert_fonts_css disabled, so this rule has to
             live here instead of in the generated stylesheet. -->
        <style type="text/css">
            .task-list-item-checkbox {
                margin-right: 0.4em;
                vertical-align: middle;
            }
            .katex img {
                object-fit: fill;
                padding: unset;
                display: block;
                position: absolute;
                width: 100%;
                height: inherit;
            }
            /* Media embeds. The theme is classless CSS, so these rules have to
                 live here rather than in a class the theme knows nothing
                 about. The frame reserves the aspect ratio so the iframe
                 scales with the page instead of overflowing it. */
            .embed {
                margin: 1.5em 0;
            }
            .embed-frame {
                position: relative;
                aspect-ratio: 16 / 9;
            }
            .embed-frame iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
            .embed figcaption {
                font-size: 0.8em;
            }
        </style>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                // markdown-katex renders ```math blocks and $`inline`$ server
                // side; $$display$$ and \(inline\) still need the browser.
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "\\(", right: "\\)", display: false}
                    ]
                });
            });
        </script>

        <noscript>
            <style>html{visibility: visible;opacity:1;}</style>
        </noscript>
    </head>
    <body>
        {{ content | safe }}
    </body>
</html>
