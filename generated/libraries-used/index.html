        <!-- Hide until the theme is applied, then reveal. The noscript block
             below is what keeps the page visible when JS is unavailable. -->
        <style>html{visibility: hidden;opacity:0;}</style>
        <link rel="stylesheet" href="../pygments.css" type="text/css">
        <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura.css" type="text/css" media="print" onload="this.media='all'">
        <link rel="icon" type="image/x-icon" href="../favicon.ico">
        <script>
            (function () {
                function reveal() {
                    var el = document.documentElement;
                    if (!el || el.style.visibility === 'visible') return;
                    el.style.visibility = 'visible';
                    el.style.opacity = 1;
                }
                window.addEventListener('load', reveal);
                // A hanging theme CDN must never leave the page blank forever.
                window.setTimeout(reveal, 3000);
            })();
        </script>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
        <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
        <!-- markdown-katex has insert_fonts_css disabled, so this rule has to
             live here instead of in the generated stylesheet. -->
        <style type="text/css">
            .task-list-item-checkbox {
                margin-right: 0.4em;
                vertical-align: middle;
            }
            .katex img {
                object-fit: fill;
                padding: unset;
                display: block;
                position: absolute;
                width: 100%;
                height: inherit;
            }
        </style>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                // markdown-katex renders ```math blocks and $`inline`$ server
                // side; $$display$$ and \(inline\) still need the browser.
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "\\(", right: "\\)", display: false}
                    ]
                });
            });
        </script>

        <noscript>
            <style>html{visibility: visible;opacity:1;}</style>
        </noscript>
